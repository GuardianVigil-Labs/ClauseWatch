version: 2

# Monthly and capped. Security updates are raised as advisories land,
# whatever the schedule. Verify a bump with npm test, the typecheck and both
# builds before merging it: the extension ships to every browser it runs in.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # Major versions are a planned change, not a monthly chore: they arrive
    # here only as security updates, which ignore this rule.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { actions: { patterns: ["*"] } }
