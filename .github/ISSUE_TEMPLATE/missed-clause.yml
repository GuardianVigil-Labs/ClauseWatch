name: Missed clause or false positive
description: ClauseWatch missed a clause a document has, quoted a sentence that does not say what the topic says, or a kind of clause it should find.
labels: [rules]
body:
  - type: markdown
    attributes:
      value: "This repository is public. Do not include personal details, or text you do not have the right to share. A pull request with fixtures is even better (docs/rules.md)."
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options:
        - A clause the rules missed
        - A sentence quoted that should not be (false positive)
        - A new kind of clause to find
    validations:
      required: true
  - type: input
    id: document
    attributes:
      label: Address of the public terms or privacy page
      description: Leave empty for a new kind of clause.
  - type: textarea
    id: sentence
    attributes:
      label: The sentence, and what it says in your own words
      description: Quote only the sentence or two that matter.
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule id, if a rule quoted it
      description: For example binding-arbitration (rules/README.md lists them).
