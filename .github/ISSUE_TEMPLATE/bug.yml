name: Bug report
description: Something in ClauseWatch does not work as described in the user guide.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "This repository is public. Do not include personal details, account tokens, or text you do not have the right to share. Report security problems privately (Security tab), not here."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use an example site (example.com) or invented text where you can.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version, ClauseWatch version
    validations:
      required: true
