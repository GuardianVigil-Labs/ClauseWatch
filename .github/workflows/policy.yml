name: policy

on:
  pull_request:

permissions:
  contents: read

jobs:
  leak-guard:
    runs-on: ubuntu-latest
    steps:
      # No token on disk while dependencies' install scripts run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Self-test first: a guard that matches nothing reports success.
      - run: node scripts/leak-guard.mjs --self-test
      - run: node scripts/leak-guard.mjs
