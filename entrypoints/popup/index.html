<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClauseWatch</title>
    <link rel="stylesheet" href="../../src/ui/theme.css" />
    <style>
      body { width: 380px; max-height: 580px; overflow-y: auto; }
      [hidden] { display: none !important; }
      header { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
      h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; flex: 1; }
      .icon { background: transparent; border: 1px solid var(--line-strong); clip-path: none; width: 28px; height: 28px; padding: 0; display: grid; place-items: center; color: var(--ink); }
      .icon[aria-expanded="true"] { border-color: var(--ink); }
      main { padding: 12px 14px 14px; }
      p { margin: 0 0 10px; }
      .note { font-size: 12px; }
      section.ai { border: 1px dashed var(--line-strong); padding: 8px 10px; margin: 8px 0; }
      .ai-label { color: var(--ink); font-size: 12px; font-weight: 500; margin: 0 0 4px; }
      blockquote { margin: 4px 0; padding-left: 8px; border-left: 1px solid var(--brand); color: var(--ink); }
      [role="tablist"] { display: flex; border-bottom: 1px solid var(--line); }
      [role="tab"] { flex: 1; background: transparent; clip-path: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 6px; color: var(--faint); font-weight: 400; }
      [role="tab"][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
      textarea, select, input.address { width: 100%; box-sizing: border-box; padding: 6px 8px; margin: 0 0 8px; }
      .row { display: flex; gap: 8px; align-items: flex-start; }
      .row input.address { flex: 1; font-family: var(--mono); font-size: 12px; }
      .row .note { margin: 0; flex: 1; }
      .box { border: 1px solid var(--line); background: var(--raised); padding: 10px 12px; margin: 0 0 10px; }
      .box h2 { font-size: 13px; font-weight: 500; margin: 0 0 6px; }
      ol.guide { list-style: none; margin: 0; padding: 0; }
      ol.guide li { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
      ol.guide .n { flex: none; width: 20px; height: 20px; display: grid; place-items: center; border: 1px solid var(--brand); color: var(--ink); font-size: 11px; background: #0b1730; }
      ol.guide strong { color: var(--ink); font-weight: 600; }
      ul.recent { list-style: none; margin: 0; padding: 0; }
      ul.recent li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); color: var(--ink); font-family: var(--mono); font-size: 12px; }
      .badge { font-family: var(--sans); border: 1px solid var(--line-strong); padding: 1px 6px; font-size: 11px; color: var(--dim); }
      .badge.amber { color: #fcd34d; border-color: #78350f; background: #2a1d06; }
      .badge.red { color: #fca5a5; border-color: #7f1d1d; background: #2a0b0b; }
      section.request h2 { font-size: 15px; margin: 0 0 8px; }
      a.button { display: inline-block; background: var(--ink); color: var(--canvas); padding: 6px 12px; text-decoration: none; font-weight: 500; clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
      section.request { border-top: 1px solid var(--line); margin: 10px 0 0; padding: 10px 0 0; }
      section.request input, section.request select { width: 100%; box-sizing: border-box; padding: 6px 8px; margin: 0 0 8px; }
      section.request pre { background: var(--raised); border: 1px solid var(--line); padding: 8px; font: 12px/1.45 var(--mono); max-height: 180px; overflow-y: auto; white-space: pre-wrap; }
      #share > h2 { font-size: 17px; margin: 0 0 4px; }
      #share .link { flex: 1; font-family: var(--mono); font-size: 12px; padding: 6px 8px; margin: 0; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
      .grid a, .grid button { display: block; text-align: center; padding: 6px 4px; border: 1px solid var(--line-strong); color: var(--ink); background: transparent; clip-path: none; text-decoration: none; font-size: 12px; font-weight: 400; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
      .chips li { border: 1px solid var(--line-strong); padding: 1px 6px; font-size: 11px; }
    </style>
  </head>
  <body>
    <header><h1><svg class="mark" viewBox="0 0 100 100" width="20" height="20" fill="none" aria-hidden="true"><g stroke="#2f80ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M 50 15 C 59 20 67 22 76 23 L 76 47 C 76 64 65 76 50 84 C 35 76 24 64 24 47 L 24 23 C 33 22 41 20 50 15 Z"/><path d="M 38 58 L 38 51 Q 38 47 42 47 L 43 47"/><path d="M 57 58 L 57 51 Q 57 47 61 47 L 62 47"/></g></svg><strong>ClauseWatch</strong></h1><button type="button" class="icon" id="share-button" aria-label="Share ClauseWatch" aria-expanded="false" aria-controls="share"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg></button><button type="button" class="icon" id="settings-button" aria-label="Settings"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></header>
    <div role="tablist" aria-label="ClauseWatch">
      <button type="button" role="tab" id="tab-site" aria-selected="true" aria-controls="main" tabindex="0">This site</button>
      <button type="button" role="tab" id="tab-scan" aria-selected="false" aria-controls="scan" tabindex="-1">Scan a link</button>
    </div>
    <main id="main" role="tabpanel" aria-labelledby="tab-site" aria-live="polite"><p class="note">Reading this page…</p></main>
    <main id="scan" role="tabpanel" aria-labelledby="tab-scan" aria-live="polite" hidden></main>
    <main id="share" hidden></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
